    <rect x="25" y="4" width="19" height="19" rx="3" fill="#EDE0C8"/>
    <rect x="4" y="25" width="19" height="19" rx="3" fill="#EDE0C8"/>
    <rect x="25" y="25" width="19" height="19" rx="3" fill="#F2B179"/>

    <text x="13.5" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#776E65" text-anchor="middle">2</text>
    <text x="34.5" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#776E65" text-anchor="middle">0</text>
    <text x="13.5" y="39" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#776E65" text-anchor="middle">4</text>
    <text x="34.5" y="39" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#F9F6F2" text-anchor="middle">8</text>
